name: Build OpenWrt VeloCloud

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git ccache gettext libssl-dev xsltproc wget unzip python3 subversion intltool libintl-perl

      - name: 3. Initialize & Update Submodules
        run: |
          git submodule init
          git submodule update

      - name: 4. Hapus Metadata SVN & Update Feeds
        run: |
          cd trunk
          # Menghapus semua folder .svn agar tidak ada lagi error format/validasi
          find . -type d -name ".svn" -exec rm -rf {} +
          
          # Update feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. Konfigurasi Firmware
        run: |
          cp openwrt.config trunk/.config
          cd trunk
          make defconfig

      - name: 6. Download Packages
        run: |
          cd trunk
          # Menggunakan || true agar proses tidak berhenti jika ada file yang gagal diunduh
          make download V=s || true

      - name: 7. Proses Kompilasi
        run: |
          cd trunk
          # Kompilasi inti
          make -j$(nproc) V=s

      - name: 8. Upload Hasil Kompilasi
        uses: actions/upload-artifact@v4
        with:
          name: compiled-firmware
          path: trunk/bin/targets/

